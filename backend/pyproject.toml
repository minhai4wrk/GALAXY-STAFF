[project]
name = "galaxy-staff-backend"
version = "1.0.0"
description = "Backend FastAPI cho hệ thống quản lý nhân sự rạp chiếu phim Galaxy Staff"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic/versions"]

[tool.ruff.lint]
# E/W: pycodestyle · F: pyflakes · I: isort · B: bugbear · UP: pyupgrade · ANN: type hints
select = ["E", "W", "F", "I", "B", "UP", "ANN", "C4", "SIM"]
ignore = [
    "ANN101", # không cần annotate `self`
    "E501",   # độ dài dòng đã do formatter lo
]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["ANN"] # test không bắt buộc type hint đầy đủ

[tool.pytest.ini_options]
testpaths = ["app/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
