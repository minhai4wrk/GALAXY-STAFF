# ===================================================================
# Galaxy Staff - Docker Compose cho môi trường DEV
#
# Chạy nhanh:
#   cp .env.example .env
#   docker compose up -d db backend
#
# Bật thêm công cụ phụ trợ:
#   docker compose --profile tools up -d      # adminer + swagger-ui
#   docker compose --profile frontend up -d   # chỉ dùng khi đã scaffold frontend/
# ===================================================================

services:
  # ---------- PostgreSQL 16 ----------
  db:
    image: postgres:16-alpine
    container_name: galaxy_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-galaxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-galaxy_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-galaxy_staff}
      # Server chạy UTC, đúng như môi trường prod trên Render (tránh lệch 7h khi test)
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script khởi tạo: tạo DB test + bật extension btree_gist (ERD mục 5.4)
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-galaxy} -d ${POSTGRES_DB:-galaxy_staff}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - galaxy_net

  # ---------- Backend FastAPI ----------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: galaxy_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Ghi đè host DB: trong network của compose, host là tên service `db`
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-galaxy}:${POSTGRES_PASSWORD:-galaxy_dev_password}@db:5432/${POSTGRES_DB:-galaxy_staff}
      TEST_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-galaxy}:${POSTGRES_PASSWORD:-galaxy_dev_password}@db:5432/${POSTGRES_DB:-galaxy_staff}_test
      TZ: UTC
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      # Bind mount để uvicorn --reload bắt được thay đổi code
      - ./backend:/app
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - galaxy_net

  # ---------- Frontend React + Vite (bật từ Sprint 1, sau khi scaffold) ----------
  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: galaxy_frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # giữ node_modules của container, không bị bind mount đè
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0
    networks:
      - galaxy_net

  # ---------- Adminer: xem/sửa DB bằng trình duyệt ----------
  adminer:
    profiles: ["tools"]
    image: adminer:4
    container_name: galaxy_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - galaxy_net

  # ---------- Swagger UI: đọc trực tiếp docs/api/openapi.yaml (dùng chụp hình báo cáo) ----------
  swagger-ui:
    profiles: ["tools"]
    image: swaggerapi/swagger-ui:latest
    container_name: galaxy_swagger
    restart: unless-stopped
    ports:
      - "${SWAGGER_PORT:-8081}:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./docs/api:/spec:ro
    networks:
      - galaxy_net

volumes:
  postgres_data:
  backend_uploads:

networks:
  galaxy_net:
    driver: bridge
